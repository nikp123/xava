inputs:
  system:
    description: 'Target operating system'
    required: true
    default: 'ubuntu'
  arch:
    description: 'Target architecture'
    required: true
    default: 'x86_64'

#
# Let's play a game.
# Can you spot the dumb GH Actions design here?
#

runs:
  using: 'composite'
  steps:
  - uses: ./.github/docker/ubuntu/make
    if: contains(inputs.system, 'ubuntu')
    with:
      system: ${{ inputs.system }}
      arch:   ${{ inputs.arch   }}
  - uses: ./.github/docker/windows/make
    if: contains(inputs.system, 'windows')
    with:
      system: ${{ inputs.system }}
      arch:   ${{ inputs.arch   }}


