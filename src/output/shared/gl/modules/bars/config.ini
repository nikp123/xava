# Config options related to the "bars" OpenGL module
# Remove ';' for the config options to apply

[bars]

# Mirrors the bars into the horizontal axis, so that
# the vertical middle is the start poistion of every
# bar
; mirror = false

# By default bars are shown left to right, where the
# left side represents lower frequencies and the right
# side represents higher frequencies. This option
# reverses that order.
; invert = false

# This option projects the rendered bars into a circle
# instead of a cartesian plane.
# This also disables automatic bar geometry calculation
# so you'll need to adjust the bar count, bar spacing and
# bar width manually for the desired look. The visualizer
# will refuse to start if you don't.
# Also, due to the nature of the bars being in a circle
# now the dimension values you put in no longer represent
# units in pixels but ratios between the bars.
; circle = false

# This section is only relevant if circle is enabled
[rotation]

# Use the intensity variable for determining how fast the
# circle will spin.
# The "intensity" variable is derived from the bar heights
# (ie. representing the loudness of the incoming audio).
; using_intensity = false

# How much is the intensity amplified for the rotation
# speed.
; intensity_scale = 1.0

# Reverse the order in which the circle spins.
# By default (false) it's counter-clockwise.
; invert = false

# How many revolutions per minute the circle makes
# To disable rotations, just set this to 0
; per_minute = 1.0

# This section is only relevant if circle is enabled
[circle]

# How much of the inner circle radius is ignored for
# rendering the circle.
# Setting this to 0 will have the bars render from the
# center point of the circle while setting it close to
# 1 will render only the outer surface of the circle.
; start_height = 0.2
;
